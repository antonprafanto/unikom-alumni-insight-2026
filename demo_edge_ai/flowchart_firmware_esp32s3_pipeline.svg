<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="100%" height="100%">
  <defs>
    <!-- Background Dot Grid -->
    <pattern id="dotgrid-flow" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#CBD5E1" />
    </pattern>

    <!-- Neo-Brutalist Hard Drop Shadow Filter -->
    <filter id="flow-shadow" x="0" y="0" width="200%" height="200%">
      <feOffset result="offOut" in="SourceAlpha" dx="4" dy="4" />
      <feColorMatrix result="matrixOut" in="offOut" type="matrix" values="0 0 0 0 0.07   0 0 0 0 0.07   0 0 0 0 0.07  0 0 0 1 0" />
      <feBlend in="SourceGraphic" in2="matrixOut" mode="normal" />
    </filter>

    <filter id="flow-shadow-sm" x="0" y="0" width="200%" height="200%">
      <feOffset result="offOut" in="SourceAlpha" dx="3" dy="3" />
      <feColorMatrix result="matrixOut" in="offOut" type="matrix" values="0 0 0 0 0.07   0 0 0 0 0.07   0 0 0 0 0.07  0 0 0 1 0" />
      <feBlend in="SourceGraphic" in2="matrixOut" mode="normal" />
    </filter>

    <!-- Marker Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F172A" />
    </marker>
  </defs>

  <!-- Background Surface -->
  <rect width="960" height="760" fill="#F8FAFC" rx="12" />
  <rect width="960" height="760" fill="url(#dotgrid-flow)" rx="12" />
  <rect width="960" height="760" fill="none" stroke="#0F172A" stroke-width="3" rx="12" />

  <!-- ==================================================================== -->
  <!-- HEADER BANNER -->
  <!-- ==================================================================== -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="900" height="52" rx="8" fill="#FFE600" stroke="#0F172A" stroke-width="2.5" filter="url(#flow-shadow-sm)" />
    <text x="20" y="33" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="800" font-size="17" fill="#0F172A">
      🔄 DIAGRAM ALIR (FLOWCHART): ESP32-S3 + MPU-6050 EDGE AI
    </text>
    <rect x="680" y="10" width="205" height="32" rx="6" fill="#0F172A" />
    <text x="782" y="31" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" fill="#00F5A0" text-anchor="middle">
      NON-BLOCKING RTOS TIMING
    </text>
  </g>

  <!-- ==================================================================== -->
  <!-- STEP 1: INITIALIZATION (setup) -->
  <!-- ==================================================================== -->
  <g transform="translate(30, 95)">
    <!-- Box Container -->
    <rect x="0" y="0" width="900" height="115" rx="8" fill="#FFFDF9" stroke="#0F172A" stroke-width="2.5" filter="url(#flow-shadow)" />
    
    <!-- Step Badge -->
    <rect x="16" y="12" width="240" height="26" rx="4" fill="#FFE600" stroke="#0F172A" stroke-width="1.5" />
    <text x="136" y="29" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12" fill="#0F172A" text-anchor="middle">
      FASE 1: INISIALISASI (setup)
    </text>

    <!-- 3 Sub-steps Cards in setup -->
    <g transform="translate(16, 46)">
      
      <!-- Card 1: Serial USB CDC -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="275" height="56" rx="5" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.5" />
        <text x="12" y="20" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="11" fill="#0F172A">1. Serial USB CDC (115200)</text>
        <text x="12" y="36" font-family="'JetBrains Mono', monospace" font-size="9" fill="#475569">Native USB CDC Auto-Wait</text>
        <text x="12" y="48" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#059669">Siap Stream WebSerial</text>
      </g>

      <!-- Card 2: I2C Bus & Scanner -->
      <g transform="translate(295, 0)">
        <rect x="0" y="0" width="280" height="56" rx="5" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.5" />
        <text x="12" y="20" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="11" fill="#0F172A">2. I2C Bus 400kHz &amp; Scanner</text>
        <text x="12" y="36" font-family="'JetBrains Mono', monospace" font-size="9" fill="#475569">SDA=IO8 · SCL=IO9 (Timeout Guard)</text>
        <text x="12" y="48" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#2563EB">Deteksi: 0x3C (OLED) &amp; 0x68 (MPU)</text>
      </g>

      <!-- Card 3: Sensor Boot & OLED -->
      <g transform="translate(595, 0)">
        <rect x="0" y="0" width="273" height="56" rx="5" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.5" />
        <text x="12" y="20" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="11" fill="#0F172A">3. Boot MPU-6050 &amp; OLED</text>
        <text x="12" y="36" font-family="'JetBrains Mono', monospace" font-size="9" fill="#475569">MPU ±4G Range · 44Hz LPF Filter</text>
        <text x="12" y="48" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#7C3AED">Animasi Bootscreen OLED</text>
      </g>
    </g>
  </g>

  <!-- Flow Arrow from setup to loop -->
  <path d="M 480 210 L 480 238" stroke="#0F172A" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  <!-- ==================================================================== -->
  <!-- STEP 2: HIGH-SPEED MPU-6050 SAMPLING -->
  <!-- ==================================================================== -->
  <g transform="translate(30, 245)">
    <rect x="0" y="0" width="900" height="92" rx="8" fill="#FFFDF9" stroke="#0F172A" stroke-width="2.5" filter="url(#flow-shadow)" />

    <!-- Step Badge -->
    <rect x="16" y="10" width="310" height="24" rx="4" fill="#00F0FF" stroke="#0F172A" stroke-width="1.5" />
    <text x="171" y="27" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="11" fill="#0F172A" text-anchor="middle">
      FASE 2: HIGH-SPEED SAMPLING MPU-6050 (50-100 Hz)
    </text>

    <!-- Sampling Details Card -->
    <g transform="translate(16, 40)">
      <rect x="0" y="0" width="868" height="42" rx="5" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.5" />
      <text x="14" y="18" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="11" fill="#0369A1">
        Akuisisi Kinematik 6-Axis: Akselerasi (Ax, Ay, Az) + Giroskop (Gx, Gy, Gz) + Suhu Die IMU
      </text>
      <text x="14" y="32" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0F172A">
        Perhitungan Sudut Orientasi Euler: Pitch = atan2(-Ax, sqrt(Ay²+Az²)) · Roll = atan2(Ay, Az) dalam satuan derajat.
      </text>
    </g>
  </g>

  <!-- Flow Arrow from Sampling to Edge AI Engine -->
  <path d="M 480 337 L 480 362" stroke="#0F172A" stroke-width="3" fill="none" marker-end="url(#arrow)" />

  <!-- ==================================================================== -->
  <!-- STEP 3: THE 4-LAYER EDGE AI INFERENCE ENGINE -->
  <!-- ==================================================================== -->
  <g transform="translate(30, 368)">
    <rect x="0" y="0" width="900" height="195" rx="8" fill="#FFFDF9" stroke="#0F172A" stroke-width="3" filter="url(#flow-shadow)" />
    
    <!-- Top Engine Header -->
    <rect x="16" y="12" width="380" height="26" rx="4" fill="#00F5A0" stroke="#0F172A" stroke-width="2" />
    <text x="206" y="29" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="12" fill="#0F172A" text-anchor="middle">
      🧠 FASE 3: PIPELINE INFERENSI EDGE AI ON-DEVICE
    </text>

    <text x="880" y="30" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#059669" text-anchor="end">
      Eksekusi di SRAM ESP32-S3 · Latensi &lt; 10 ms
    </text>

    <!-- 4 Layers Grid -->
    <g transform="translate(16, 48)">
      
      <!-- Layer 1: Feature Extraction -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="205" height="130" rx="6" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
        <rect x="6" y="6" width="193" height="22" rx="3" fill="#38BDF8" />
        <text x="102" y="21" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="10" fill="#0F172A" text-anchor="middle">LAYER 1: DSP FEATURE</text>
        <text x="10" y="44" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#0F172A">• Magnitudo |A| = √(Ax²+Ay²+Az²)</text>
        <text x="10" y="62" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#0F172A">• Dynamic G = ||A| - 1.0G|</text>
        <text x="10" y="80" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#0369A1">• Sliding Window (N=16 Buffer)</text>
        <text x="10" y="98" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#0369A1">• Hitung RMS Energy Getaran</text>
      </g>

      <!-- Arrow L1 to L2 -->
      <path d="M 207 65 L 217 65" stroke="#0F172A" stroke-width="2" fill="none" marker-end="url(#arrow)" />

      <!-- Layer 2: Vibration Classifier -->
      <g transform="translate(220, 0)">
        <rect x="0" y="0" width="205" height="130" rx="6" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
        <rect x="6" y="6" width="193" height="22" rx="3" fill="#FFE600" />
        <text x="102" y="21" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="10" fill="#0F172A" text-anchor="middle">LAYER 2: PRED. MAINT.</text>
        <text x="10" y="44" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#0F172A">• Deteksi Pola Kerusakan Mesin</text>
        <text x="10" y="62" font-family="'JetBrains Mono', monospace" font-size="8" fill="#475569">Ambang Anomali:</text>
        <text x="10" y="78" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#D97706">RMS &gt; 0.40G ATAU Peak &gt; 0.85G</text>
        <text x="10" y="98" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#DC2626">→ VIBRATION ANOMALY!</text>
      </g>

      <!-- Arrow L2 to L3 -->
      <path d="M 427 65 L 437 65" stroke="#0F172A" stroke-width="2" fill="none" marker-end="url(#arrow)" />

      <!-- Layer 3: Gesture Intent -->
      <g transform="translate(440, 0)">
        <rect x="0" y="0" width="205" height="130" rx="6" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
        <rect x="6" y="6" width="193" height="22" rx="3" fill="#FF6B8B" />
        <text x="102" y="21" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="10" fill="#FFFFFF" text-anchor="middle">LAYER 3: GESTURE REMOTE</text>
        <text x="10" y="44" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#0F172A">• Attitude Roll/Pitch Intent</text>
        <text x="10" y="62" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#E11D48">Roll &gt; +40° → NEXT SLIDE</text>
        <text x="10" y="78" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#E11D48">Roll &lt; -40° → PREV SLIDE</text>
        <text x="10" y="96" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#475569">Peak &gt; 1.8G → TAP ACTION</text>
      </g>

      <!-- Arrow L3 to L4 -->
      <path d="M 647 65 L 657 65" stroke="#0F172A" stroke-width="2" fill="none" marker-end="url(#arrow)" />

      <!-- Layer 4: Composite Safety -->
      <g transform="translate(660, 0)">
        <rect x="0" y="0" width="208" height="130" rx="6" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
        <rect x="6" y="6" width="196" height="22" rx="3" fill="#0F172A" />
        <text x="104" y="21" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="10" fill="#00F5A0" text-anchor="middle">LAYER 4: SAFETY STATE</text>
        <text x="10" y="44" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#059669">✓ NOMINAL (98% Conf)</text>
        <text x="10" y="62" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#D97706">⚠️ VIB ANOMALY (85-99%)</text>
        <text x="10" y="80" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#DC2626">🚨 HARSH IMPACT (99%)</text>
        <text x="10" y="100" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#2563EB">⚡ Latensi: &lt; 10 ms (INT8)</text>
      </g>
    </g>
  </g>

  <!-- Flow Split to Dual Output -->
  <path d="M 260 563 L 260 595" stroke="#0F172A" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 700 563 L 700 595" stroke="#0F172A" stroke-width="2.5" fill="none" marker-end="url(#arrow)" />

  <!-- ==================================================================== -->
  <!-- STEP 4: OUTPUT DISPATCH (OLED HUD & WEB SERIAL TELEMETRY) -->
  <!-- ==================================================================== -->
  
  <!-- Output 1: Local OLED HUD -->
  <g transform="translate(30, 600)">
    <rect x="0" y="0" width="435" height="140" rx="8" fill="#FFFDF9" stroke="#0F172A" stroke-width="2.5" filter="url(#flow-shadow)" />
    
    <rect x="14" y="12" width="280" height="26" rx="4" fill="#FFE600" stroke="#0F172A" stroke-width="1.5" />
    <text x="154" y="29" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="11" fill="#0F172A" text-anchor="middle">
      OUTPUT 1: LOCAL OLED HUD (10 FPS)
    </text>

    <g transform="translate(14, 46)">
      <rect x="0" y="0" width="407" height="78" rx="5" fill="#0284C7" stroke="#0F172A" stroke-width="1.5" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#38BDF8">EDGE-AI S3 [8.4ms]</text>
      <text x="12" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#FFFFFF">&gt;&gt; STATE: NOMINAL (98%) [INT8]</text>
      <text x="12" y="56" font-family="'JetBrains Mono', monospace" font-size="9" fill="#E0F2FE">DynG: 0.04G · RMS: 0.02 · Pit: +2° · Rol: -1°</text>
      <text x="12" y="70" font-family="'JetBrains Mono', monospace" font-size="8" fill="#BAE6FD">Non-blocking renderOLED() via I2C (0x3C) @ 100ms interval</text>
    </g>
  </g>

  <!-- Output 2: WebSerial Stream & Slide Bridge -->
  <g transform="translate(495, 600)">
    <rect x="0" y="0" width="435" height="140" rx="8" fill="#FFFDF9" stroke="#0F172A" stroke-width="2.5" filter="url(#flow-shadow)" />
    
    <rect x="14" y="12" width="280" height="26" rx="4" fill="#00F0FF" stroke="#0F172A" stroke-width="1.5" />
    <text x="154" y="29" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="11" fill="#0F172A" text-anchor="middle">
      OUTPUT 2: SERIAL TELEMETRY (20 FPS)
    </text>

    <g transform="translate(14, 46)">
      <rect x="0" y="0" width="407" height="78" rx="5" fill="#0F172A" stroke="#0F172A" stroke-width="1.5" />
      <text x="10" y="20" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00F5A0">
        {"acc":{"x":0.0,"y":0.0,"z":9.8},"ori":{"pitch":0,"roll":0}...}
      </text>
      <text x="10" y="38" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8">
        • WebSerial USB Stream (115200 Baud) ke Dashboard
      </text>
      <text x="10" y="54" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FFE600">
        • BroadcastChannel('unikom_slide_channel') Remote Bridge
      </text>
      <text x="10" y="68" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8">
        Kirim data JSON teringkas (&lt;256 bytes) setiap 50ms (20 Hz)
      </text>
    </g>
  </g>

</svg>
