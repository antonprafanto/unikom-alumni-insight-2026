<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="100%">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#CBD5E1" />
    </pattern>

    <!-- Drop Shadow Filter for Neo-Brutalist look -->
    <filter id="shadow" x="0" y="0" width="200%" height="200%">
      <feOffset result="offOut" in="SourceAlpha" dx="4" dy="4" />
      <feColorMatrix result="matrixOut" in="offOut" type="matrix" values="0 0 0 0 0.07   0 0 0 0 0.07   0 0 0 0 0.07  0 0 0 1 0" />
      <feBlend in="SourceGraphic" in2="matrixOut" mode="normal" />
    </filter>

    <filter id="shadow-sm" x="0" y="0" width="200%" height="200%">
      <feOffset result="offOut" in="SourceAlpha" dx="2.5" dy="2.5" />
      <feColorMatrix result="matrixOut" in="offOut" type="matrix" values="0 0 0 0 0.07   0 0 0 0 0.07   0 0 0 0 0.07  0 0 0 1 0" />
      <feBlend in="SourceGraphic" in2="matrixOut" mode="normal" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="580" fill="#F8FAFC" rx="12" />
  <rect width="960" height="580" fill="url(#grid)" rx="12" />
  <rect width="960" height="580" fill="none" stroke="#1E293B" stroke-width="3" rx="12" />

  <!-- HEADER -->
  <g transform="translate(30, 24)">
    <rect x="0" y="0" width="900" height="54" rx="8" fill="#FFE600" stroke="#1E293B" stroke-width="2.5" filter="url(#shadow-sm)" />
    <text x="18" y="34" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="800" font-size="18" fill="#0F172A">
      ⚡ SKEMA WIRING I2C: MULTI-MODAL EDGE AI NODE (ESP32-S3)
    </text>
    <rect x="710" y="12" width="172" height="30" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <text x="796" y="32" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="12" fill="#38BDF8" text-anchor="middle">
      SINGLE I2C BUS (400kHz)
    </text>
  </g>

  <!-- ==================================================================== -->
  <!-- WIRING BUS LINES & TRACES -->
  <!-- ==================================================================== -->
  <g id="wires" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 1. POWER 3.3V (RED) -->
    <!-- Main Bus Rail -->
    <path d="M 240 160 L 290 160 L 290 120 L 890 120" fill="none" stroke="#EF4444" stroke-width="3.5" />
    <!-- Drops to modules -->
    <path d="M 400 120 L 400 170" fill="none" stroke="#EF4444" stroke-width="3" />
    <path d="M 600 120 L 600 170" fill="none" stroke="#EF4444" stroke-width="3" />
    <path d="M 800 120 L 800 170" fill="none" stroke="#EF4444" stroke-width="3" />

    <!-- 2. GROUND GND (BLACK) -->
    <!-- Main Bus Rail -->
    <path d="M 240 190 L 310 190 L 310 140 L 905 140" fill="none" stroke="#1E293B" stroke-width="3.5" />
    <!-- Drops to modules -->
    <path d="M 420 140 L 420 170" fill="none" stroke="#1E293B" stroke-width="3" />
    <path d="M 620 140 L 620 170" fill="none" stroke="#1E293B" stroke-width="3" />
    <path d="M 820 140 L 820 170" fill="none" stroke="#1E293B" stroke-width="3" />

    <!-- 3. I2C SDA - GPIO 8 (GREEN) -->
    <!-- Main Bus Rail -->
    <path d="M 240 220 L 330 220 L 330 420 L 905 420" fill="none" stroke="#10B981" stroke-width="3.5" />
    <!-- Drops to modules -->
    <path d="M 440 420 L 440 370" fill="none" stroke="#10B981" stroke-width="3" />
    <path d="M 640 420 L 640 370" fill="none" stroke="#10B981" stroke-width="3" />
    <path d="M 840 420 L 840 370" fill="none" stroke="#10B981" stroke-width="3" />

    <!-- 4. I2C SCL - GPIO 9 (BLUE) -->
    <!-- Main Bus Rail -->
    <path d="M 240 250 L 350 250 L 350 440 L 890 440" fill="none" stroke="#2563EB" stroke-width="3.5" />
    <!-- Drops to modules -->
    <path d="M 460 440 L 460 370" fill="none" stroke="#2563EB" stroke-width="3" />
    <path d="M 660 440 L 660 370" fill="none" stroke="#2563EB" stroke-width="3" />
    <path d="M 860 440 L 860 370" fill="none" stroke="#2563EB" stroke-width="3" />

    <!-- Bus Junction Dots -->
    <circle cx="400" cy="120" r="4.5" fill="#EF4444" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="600" cy="120" r="4.5" fill="#EF4444" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="800" cy="120" r="4.5" fill="#EF4444" stroke="#1E293B" stroke-width="1.5" />

    <circle cx="420" cy="140" r="4.5" fill="#1E293B" stroke="#F8FAFC" stroke-width="1.5" />
    <circle cx="620" cy="140" r="4.5" fill="#1E293B" stroke="#F8FAFC" stroke-width="1.5" />
    <circle cx="820" cy="140" r="4.5" fill="#1E293B" stroke="#F8FAFC" stroke-width="1.5" />

    <circle cx="440" cy="420" r="4.5" fill="#10B981" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="640" cy="420" r="4.5" fill="#10B981" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="840" cy="420" r="4.5" fill="#10B981" stroke="#1E293B" stroke-width="1.5" />

    <circle cx="460" cy="440" r="4.5" fill="#2563EB" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="660" cy="440" r="4.5" fill="#2563EB" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="860" cy="440" r="4.5" fill="#2563EB" stroke="#1E293B" stroke-width="1.5" />
  </g>

  <!-- ==================================================================== -->
  <!-- MODULE 1: ESP32-S3 DEVKIT (CONTROLLER) -->
  <!-- ==================================================================== -->
  <g transform="translate(45, 110)">
    <!-- Board PCB -->
    <rect x="0" y="0" width="200" height="320" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="3" filter="url(#shadow)" />
    
    <!-- Metallic RF Shield (ESP32-S3-WROOM) -->
    <rect x="35" y="45" width="130" height="110" rx="4" fill="#E2E8F0" stroke="#64748B" stroke-width="2" />
    <!-- RF Chip Label -->
    <text x="100" y="85" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="14" fill="#0F172A" text-anchor="middle">ESP32-S3</text>
    <text x="100" y="105" font-family="'JetBrains Mono', monospace" font-size="9" fill="#475569" text-anchor="middle">Xtensa LX7 Dual-Core</text>
    <text x="100" y="120" font-family="'JetBrains Mono', monospace" font-size="9" fill="#059669" font-weight="700" text-anchor="middle">AI Vector Extension</text>
    <rect x="85" y="130" width="30" height="15" rx="2" fill="#CBD5E1" stroke="#94A3B8" />

    <!-- USB Type-C Port Bottom -->
    <rect x="70" y="295" width="60" height="25" rx="4" fill="#64748B" stroke="#0F172A" stroke-width="2" />
    <text x="100" y="312" font-family="'JetBrains Mono', monospace" font-size="8" fill="#F8FAFC" font-weight="700" text-anchor="middle">USB CDC</text>

    <!-- Top Label -->
    <rect x="25" y="12" width="150" height="20" rx="4" fill="#38BDF8" stroke="#0F172A" stroke-width="1.5" />
    <text x="100" y="26" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="11" fill="#0F172A" text-anchor="middle">
      ESP32-S3 DEVKIT
    </text>

    <!-- Right Header Pin Rows -->
    <!-- 3.3V -->
    <g transform="translate(145, 50)">
      <rect x="0" y="0" width="55" height="22" rx="3" fill="#EF4444" stroke="#1E293B" stroke-width="1.5" />
      <circle cx="50" cy="11" r="3" fill="#FFF" />
      <text x="22" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#FFF">3.3V</text>
    </g>

    <!-- GND -->
    <g transform="translate(145, 80)">
      <rect x="0" y="0" width="55" height="22" rx="3" fill="#1E293B" stroke="#64748B" stroke-width="1.5" />
      <circle cx="50" cy="11" r="3" fill="#FFF" />
      <text x="22" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#FFF">GND</text>
    </g>

    <!-- GPIO 8 (SDA) -->
    <g transform="translate(145, 110)">
      <rect x="0" y="0" width="55" height="22" rx="3" fill="#10B981" stroke="#1E293B" stroke-width="1.5" />
      <circle cx="50" cy="11" r="3" fill="#FFF" />
      <text x="8" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#0F172A">IO8 (SDA)</text>
    </g>

    <!-- GPIO 9 (SCL) -->
    <g transform="translate(145, 140)">
      <rect x="0" y="0" width="55" height="22" rx="3" fill="#2563EB" stroke="#1E293B" stroke-width="1.5" />
      <circle cx="50" cy="11" r="3" fill="#FFF" />
      <text x="8" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#FFF">IO9 (SCL)</text>
    </g>
  </g>

  <!-- ==================================================================== -->
  <!-- MODULE 2: OLED 0.96" SSD1306 (0x3C) -->
  <!-- ==================================================================== -->
  <g transform="translate(365, 170)">
    <!-- Board PCB -->
    <rect x="0" y="0" width="150" height="200" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="2.5" filter="url(#shadow)" />
    
    <!-- Top Pins (VCC, GND, SCL, SDA) -->
    <!-- VCC (Pin 1) -->
    <rect x="30" y="0" width="10" height="12" fill="#EF4444" stroke="#1E293B" stroke-width="1" />
    <text x="35" y="24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#EF4444" text-anchor="middle">VCC</text>

    <!-- GND (Pin 2) -->
    <rect x="50" y="0" width="10" height="12" fill="#64748B" stroke="#1E293B" stroke-width="1" />
    <text x="55" y="24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#94A3B8" text-anchor="middle">GND</text>

    <!-- SCL (Pin 3) -->
    <rect x="70" y="0" width="10" height="12" fill="#2563EB" stroke="#1E293B" stroke-width="1" />
    <text x="75" y="24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#60A5FA" text-anchor="middle">SCL</text>

    <!-- SDA (Pin 4) -->
    <rect x="90" y="0" width="10" height="12" fill="#10B981" stroke="#1E293B" stroke-width="1" />
    <text x="95" y="24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#34D399" text-anchor="middle">SDA</text>

    <!-- OLED Glass Screen (Active Display Simulation) -->
    <rect x="15" y="34" width="120" height="125" rx="4" fill="#0284C7" stroke="#0F172A" stroke-width="2" />
    
    <!-- Screen Header -->
    <rect x="15" y="34" width="120" height="18" fill="#0C4A6E" />
    <text x="20" y="47" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#38BDF8">EDGE-AI S3</text>
    <text x="110" y="47" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#7DD3FC">8.4ms</text>
    
    <!-- Screen Body -->
    <text x="20" y="70" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#FFFFFF">&gt;&gt; NOMINAL</text>
    <text x="20" y="88" font-family="'JetBrains Mono', monospace" font-size="8" fill="#E0F2FE">CONF: 98% [INT8]</text>
    
    <line x1="20" y1="98" x2="130" y2="98" stroke="#38BDF8" stroke-width="1" />
    <text x="20" y="112" font-family="'JetBrains Mono', monospace" font-size="8" fill="#E0F2FE">Vib: 0.04G</text>
    <text x="80" y="112" font-family="'JetBrains Mono', monospace" font-size="8" fill="#E0F2FE">GST:IDLE</text>
    <text x="20" y="128" font-family="'JetBrains Mono', monospace" font-size="8" fill="#E0F2FE">Tmp: 28.4C</text>
    <text x="80" y="128" font-family="'JetBrains Mono', monospace" font-size="8" fill="#E0F2FE">Gas: 85k</text>

    <!-- Module Label Bottom -->
    <rect x="15" y="168" width="120" height="22" rx="3" fill="#FFE600" stroke="#0F172A" stroke-width="1.5" />
    <text x="75" y="183" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="11" fill="#0F172A" text-anchor="middle">
      OLED 0.96" (0x3C)
    </text>
  </g>

  <!-- ==================================================================== -->
  <!-- MODULE 3: MPU-6050 6-AXIS IMU (0x68) -->
  <!-- ==================================================================== -->
  <g transform="translate(565, 170)">
    <!-- Board PCB -->
    <rect x="0" y="0" width="150" height="200" rx="8" fill="#0284C7" stroke="#0F172A" stroke-width="2.5" filter="url(#shadow)" />
    
    <!-- Top Pins (VCC, GND, SCL, SDA) -->
    <!-- VCC (Pin 1) -->
    <rect x="30" y="0" width="10" height="12" fill="#EF4444" stroke="#1E293B" stroke-width="1" />
    <text x="35" y="24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FEE2E2" text-anchor="middle">VCC</text>

    <!-- GND (Pin 2) -->
    <rect x="50" y="0" width="10" height="12" fill="#1E293B" stroke="#0F172A" stroke-width="1" />
    <text x="55" y="24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#E2E8F0" text-anchor="middle">GND</text>

    <!-- SCL (Pin 3) -->
    <rect x="70" y="0" width="10" height="12" fill="#2563EB" stroke="#1E293B" stroke-width="1" />
    <text x="75" y="24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#DBEAFE" text-anchor="middle">SCL</text>

    <!-- SDA (Pin 4) -->
    <rect x="90" y="0" width="10" height="12" fill="#10B981" stroke="#1E293B" stroke-width="1" />
    <text x="95" y="24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#D1FAE5" text-anchor="middle">SDA</text>

    <!-- IMU QFN Chip Center -->
    <rect x="45" y="55" width="60" height="60" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <text x="75" y="85" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">MPU</text>
    <text x="75" y="100" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">6050</text>

    <!-- Coordinate Axis Guide -->
    <path d="M 75 130 L 75 145 M 75 145 L 90 145" stroke="#FFE600" stroke-width="2" fill="none" />
    <text x="98" y="148" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FFE600">X/Y</text>
    <text x="75" y="125" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FFE600" text-anchor="middle">Z</text>

    <!-- Module Label Bottom -->
    <rect x="15" y="168" width="120" height="22" rx="3" fill="#00F5A0" stroke="#0F172A" stroke-width="1.5" />
    <text x="75" y="183" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="11" fill="#0F172A" text-anchor="middle">
      MPU-6050 (0x68)
    </text>
  </g>

  <!-- ==================================================================== -->
  <!-- MODULE 4: BME-680 GAS & ENV SENSOR (0x77) -->
  <!-- ==================================================================== -->
  <g transform="translate(765, 170)">
    <!-- Board PCB -->
    <rect x="0" y="0" width="150" height="200" rx="8" fill="#7C3AED" stroke="#0F172A" stroke-width="2.5" filter="url(#shadow)" />
    
    <!-- Top Pins (VCC, GND, SCL, SDA) -->
    <!-- VCC (Pin 1) -->
    <rect x="30" y="0" width="10" height="12" fill="#EF4444" stroke="#1E293B" stroke-width="1" />
    <text x="35" y="24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FEE2E2" text-anchor="middle">VCC</text>

    <!-- GND (Pin 2) -->
    <rect x="50" y="0" width="10" height="12" fill="#1E293B" stroke="#0F172A" stroke-width="1" />
    <text x="55" y="24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#E2E8F0" text-anchor="middle">GND</text>

    <!-- SCL (Pin 3) -->
    <rect x="70" y="0" width="10" height="12" fill="#2563EB" stroke="#1E293B" stroke-width="1" />
    <text x="75" y="24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#DBEAFE" text-anchor="middle">SCL</text>

    <!-- SDA (Pin 4) -->
    <rect x="90" y="0" width="10" height="12" fill="#10B981" stroke="#1E293B" stroke-width="1" />
    <text x="95" y="24" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#D1FAE5" text-anchor="middle">SDA</text>

    <!-- Metal Gas Chamber Center -->
    <rect x="45" y="55" width="60" height="60" rx="6" fill="#E2E8F0" stroke="#4C1D95" stroke-width="2" />
    <circle cx="75" cy="85" r="14" fill="#94A3B8" stroke="#475569" stroke-width="1.5" />
    <circle cx="75" cy="85" r="5" fill="#475569" />
    
    <text x="75" y="132" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#EDE9FE" text-anchor="middle">
      VOC · TEMP · HUM · BARO
    </text>

    <!-- Module Label Bottom -->
    <rect x="15" y="168" width="120" height="22" rx="3" fill="#FF6B8B" stroke="#0F172A" stroke-width="1.5" />
    <text x="75" y="183" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">
      BME-680 (0x77)
    </text>
  </g>

  <!-- ==================================================================== -->
  <!-- BOTTOM FOOTER & WIRE COLOR LEGEND -->
  <!-- ==================================================================== -->
  <g transform="translate(45, 490)">
    <rect x="0" y="0" width="870" height="65" rx="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" filter="url(#shadow-sm)" />
    
    <text x="20" y="38" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="13" fill="#0F172A">
      PETUNJUK KABEL I2C:
    </text>

    <!-- Wire 1: VCC -->
    <g transform="translate(160, 20)">
      <line x1="0" y1="18" x2="30" y2="18" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
      <text x="38" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0F172A">3.3V (VCC)</text>
    </g>

    <!-- Wire 2: GND -->
    <g transform="translate(320, 20)">
      <line x1="0" y1="18" x2="30" y2="18" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />
      <text x="38" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0F172A">GND (Ground)</text>
    </g>

    <!-- Wire 3: SDA -->
    <g transform="translate(500, 20)">
      <line x1="0" y1="18" x2="30" y2="18" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
      <text x="38" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0F172A">GPIO 8 (SDA)</text>
    </g>

    <!-- Wire 4: SCL -->
    <g transform="translate(680, 20)">
      <line x1="0" y1="18" x2="30" y2="18" stroke="#2563EB" stroke-width="4" stroke-linecap="round" />
      <text x="38" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#0F172A">GPIO 9 (SCL)</text>
    </g>
  </g>

</svg>
